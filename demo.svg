<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    .terminal-text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="600" height="400" rx="12" fill="#0f172a"/>

  <!-- MacBook body -->
  <rect x="120" y="20" width="360" height="225" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="132" y="32" width="336" height="195" rx="4" fill="#0f172a"/>
  <rect x="270" y="22" width="60" height="10" rx="3" fill="#0f172a"/>

  <!-- Camera LED -->
  <circle cx="300" cy="27" r="3" fill="#1a1a2e" opacity="0.3">
    <!-- Blink: 1.5s to 4s in each 8s cycle -->
    <animate attributeName="fill" values="#1a1a2e;#22c55e;#1a1a2e" dur="1s" begin="1.5s;9.5s;17.5s;25.5s;33.5s;41.5s;49.5s" end="4s;12s;20s;28s;36s;44s;52s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="1.5s;9.5s;17.5s;25.5s;33.5s;41.5s;49.5s" end="4s;12s;20s;28s;36s;44s;52s" repeatCount="indefinite"/>
    <!-- Reset to off -->
    <animate attributeName="fill" values="#1a1a2e;#1a1a2e" dur="0.01s" begin="4s;12s;20s;28s;36s;44s;52s" fill="freeze"/>
    <animate attributeName="opacity" values="0.3;0.3" dur="0.01s" begin="4s;12s;20s;28s;36s;44s;52s" fill="freeze"/>
  </circle>

  <!-- LED glow -->
  <circle cx="300" cy="27" r="8" fill="transparent" opacity="0">
    <animate attributeName="fill" values="transparent;#22c55e;transparent" dur="1s" begin="1.5s;9.5s;17.5s;25.5s;33.5s;41.5s;49.5s" end="4s;12s;20s;28s;36s;44s;52s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="1s" begin="1.5s;9.5s;17.5s;25.5s;33.5s;41.5s;49.5s" end="4s;12s;20s;28s;36s;44s;52s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0" dur="0.01s" begin="4s;12s;20s;28s;36s;44s;52s" fill="freeze"/>
  </circle>

  <!-- Phase 1: Command (visible 0.5s-7s, then hide for reset) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s;8.5s;16.5s;24.5s;32.5s;40.5s;48.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.3s" begin="7s;15s;23s;31s;39s;47s;55s" fill="freeze"/>
    <text x="148" y="65" class="terminal-text" fill="#22c55e">$</text>
    <text x="162" y="65" class="terminal-text" fill="#94a3b8">claude "edit my config file"</text>
  </g>

  <!-- Phase 2: Permission prompt (visible 1.5s-7s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s;9.5s;17.5s;25.5s;33.5s;41.5s;49.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.3s" begin="7s;15s;23s;31s;39s;47s;55s" fill="freeze"/>
    <text x="148" y="90" class="terminal-text" fill="#facc15">⚡ Claude wants to edit config.json</text>
    <text x="148" y="110" class="terminal-text" fill="#475569">   Allow? (y/n)</text>
  </g>

  <!-- LED label (visible 1.5s-4s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s;9.5s;17.5s;25.5s;33.5s;41.5s;49.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.01s" begin="4s;12s;20s;28s;36s;44s;52s" fill="freeze"/>
    <line x1="320" y1="27" x2="390" y2="15" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </line>
    <text x="395" y="19" font-family="sans-serif" font-size="11" fill="#22c55e" font-weight="bold">
      LED blinking
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Phase 3: User approves (visible 4s-7s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4s;12s;20s;28s;36s;44s;52s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.3s" begin="7s;15s;23s;31s;39s;47s;55s" fill="freeze"/>
    <text x="148" y="140" class="terminal-text" fill="#22c55e">y</text>
    <text x="148" y="165" class="terminal-text" fill="#94a3b8">✓ Config updated</text>
  </g>

  <!-- LED off label (visible 5s-7s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="5s;13s;21s;29s;37s;45s;53s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.3s" begin="7s;15s;23s;31s;39s;47s;55s" fill="freeze"/>
    <text x="395" y="19" font-family="sans-serif" font-size="11" fill="#475569">LED off ✓</text>
  </g>

  <!-- MacBook base -->
  <path d="M100 245 L120 245 L130 260 L470 260 L480 245 L500 245 L490 270 L110 270 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="255" y="248" width="90" height="5" rx="2" fill="#334155"/>

  <!-- Bottom info text -->
  <text x="300" y="310" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0" font-weight="600">Camera LED blinks when Claude needs permission</text>
  <text x="300" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">No photos saved · LED only · macOS</text>

  <!-- Flow diagram -->
  <g transform="translate(70, 355)">
    <rect x="0" y="0" width="100" height="24" rx="4" fill="#1e3a5f"/>
    <text x="50" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#60a5fa">Permission asked</text>
    <text x="110" y="16" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">→</text>
    <rect x="120" y="0" width="100" height="24" rx="4" fill="#14532d"/>
    <text x="170" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4ade80">LED blinks</text>
    <text x="230" y="16" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">→</text>
    <rect x="240" y="0" width="100" height="24" rx="4" fill="#1e3a5f"/>
    <text x="290" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#60a5fa">User responds</text>
    <text x="350" y="16" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">→</text>
    <rect x="360" y="0" width="100" height="24" rx="4" fill="#1c1917"/>
    <text x="410" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a8a29e">LED stops</text>
  </g>
</svg>
