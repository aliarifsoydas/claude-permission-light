<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; fill: #22c55e; }
      50% { opacity: 0.15; fill: #166534; }
    }
    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    .led-on { animation: blink 1s ease-in-out infinite; }
    .led-off { fill: #1a1a2e; opacity: 0.3; }
    .phase1 { opacity: 0; animation: fadein 0.3s forwards; animation-delay: 0.5s; }
    .phase2 { opacity: 0; animation: fadein 0.3s forwards; animation-delay: 1.5s; }
    .phase3 { opacity: 0; animation: fadein 0.3s forwards; animation-delay: 4s; }
    .phase4 { opacity: 0; animation: fadein 0.3s forwards; animation-delay: 5s; }
    .terminal-bg { fill: #1a1a2e; rx: 8; }
    .terminal-text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
    .prompt { fill: #22c55e; }
    .output { fill: #94a3b8; }
    .highlight { fill: #facc15; }
    .dim { fill: #475569; }
  </style>

  <!-- Background -->
  <rect width="600" height="400" rx="12" fill="#0f172a"/>

  <!-- MacBook body -->
  <rect x="120" y="20" width="360" height="225" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Screen -->
  <rect x="132" y="32" width="336" height="195" rx="4" fill="#0f172a"/>

  <!-- Camera notch area -->
  <rect x="270" y="22" width="60" height="10" rx="3" fill="#0f172a"/>

  <!-- Camera LED - blinks in phase 2, off in phase 4 -->
  <circle cx="300" cy="27" r="3" class="led-off">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="1.5s" end="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#1a1a2e;#22c55e;#1a1a2e" dur="1s" begin="1.5s" end="4s" repeatCount="indefinite"/>
    <set attributeName="fill" to="#1a1a2e" begin="4s"/>
    <set attributeName="opacity" to="0.3" begin="4s"/>
  </circle>

  <!-- LED glow effect -->
  <circle cx="300" cy="27" r="8" fill="none">
    <animate attributeName="opacity" values="0;0.4;0" dur="1s" begin="1.5s" end="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="transparent;#22c55e;transparent" dur="1s" begin="1.5s" end="4s" repeatCount="indefinite"/>
    <set attributeName="opacity" to="0" begin="4s"/>
  </circle>

  <!-- Terminal content inside screen -->

  <!-- Line 1: Claude prompt -->
  <g class="phase1">
    <text x="148" y="65" class="terminal-text prompt">$</text>
    <text x="162" y="65" class="terminal-text output">claude "edit my config file"</text>
  </g>

  <!-- Line 2: Permission request -->
  <g class="phase2">
    <text x="148" y="90" class="terminal-text highlight">⚡ Claude wants to edit config.json</text>
    <text x="148" y="110" class="terminal-text dim">   Allow? (y/n)</text>
  </g>

  <!-- LED label -->
  <g class="phase2">
    <line x1="320" y1="27" x2="390" y2="15" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="1.5s" end="4s" repeatCount="indefinite"/>
      <set attributeName="opacity" to="0" begin="4s"/>
    </line>
    <text x="395" y="19" font-family="sans-serif" font-size="11" fill="#22c55e" font-weight="bold">
      LED blinking
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" begin="1.5s" end="4s" repeatCount="indefinite"/>
      <set attributeName="opacity" to="0" begin="4s"/>
    </text>
  </g>

  <!-- Line 3: User approves -->
  <g class="phase3">
    <text x="148" y="140" class="terminal-text prompt">y</text>
    <text x="148" y="165" class="terminal-text output">✓ Config updated</text>
  </g>

  <!-- LED off label -->
  <g class="phase4">
    <text x="395" y="19" font-family="sans-serif" font-size="11" fill="#475569">LED off ✓</text>
  </g>

  <!-- MacBook base -->
  <path d="M100 245 L120 245 L130 260 L470 260 L480 245 L500 245 L490 270 L110 270 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Trackpad -->
  <rect x="255" y="248" width="90" height="5" rx="2" fill="#334155"/>

  <!-- Bottom info text -->
  <text x="300" y="310" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e2e8f0" font-weight="600">Camera LED blinks when Claude needs permission</text>
  <text x="300" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">No photos saved · LED only · macOS</text>

  <!-- Flow diagram -->
  <g transform="translate(70, 355)">
    <rect x="0" y="0" width="100" height="24" rx="4" fill="#1e3a5f"/>
    <text x="50" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#60a5fa">Permission asked</text>

    <text x="110" y="16" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">→</text>

    <rect x="120" y="0" width="100" height="24" rx="4" fill="#14532d"/>
    <text x="170" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4ade80">LED blinks</text>

    <text x="230" y="16" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">→</text>

    <rect x="240" y="0" width="100" height="24" rx="4" fill="#1e3a5f"/>
    <text x="290" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#60a5fa">User responds</text>

    <text x="350" y="16" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">→</text>

    <rect x="360" y="0" width="100" height="24" rx="4" fill="#1c1917"/>
    <text x="410" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a8a29e">LED stops</text>
  </g>

  <!-- Replay hint -->
  <text x="300" y="398" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#334155">Animation loops automatically</text>

  <!-- Full animation restart -->
  <set attributeName="x" to="0" begin="7s"/>
</svg>
